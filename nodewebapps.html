      body {
        font-family: "Poppins", sans-serif;
        background: #0b0f19;

        margin: 0;
      }
      header {
        text-align: center;
        padding: 5px 20px;
        background: linear-gradient(135deg, #1a237e, #0d47a1);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      header h1 {
        font-size: 48px;
        font-weight: 700;
        animation: fadeIn 1.5s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      header p {
        opacity: 0.8;
        font-size: 18px;
      }
      .controls {
        max-width: 1300px;
        margin: 20px auto;
        padding: 10px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .controls input,
      .controls select {
        flex: 1;
        min-width: 150px;
        padding: 10px;
        background: #1f2937;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        font-family: "Poppins", sans-serif;
      }
      .controls input::placeholder {
        color: #9ca3af;
      }
      .grid {
        max-width: 1300px;
        margin: 20px auto;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }
      .card {
        background: #111827;
        border-radius: 16px;
        padding: 25px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.35);
        transition: 0.3s;
        display: block;
      }
      .card:hover {
        transform: translateY(-8px);
        border-color: #3ea6ff;
        box-shadow: 0px 12px 35px rgba(62, 166, 255, 0.5);
      }
      .avatar {
        width: 48px;
        height: 48px;
        background: #1e293b;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 600;
        font-size: 18px;
        color: #a5b4fc;
        margin-bottom: 10px;
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 8px;
        background: rgba(0, 200, 255, 0.14);
        color: #38bdf8;
        margin-left: 10px;
        font-weight: 500;
      }
      .details {
        margin: 12px 0;
        opacity: 0.85;
        font-size: 14px;
        line-height: 1.5;
      }
      .tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .tag {
        background: #1f2937;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0.8;
      }
      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .btn {
        flex: 1;
        padding: 10px;
        background: #1f2937;
        color: #fff;
        text-align: center;
        border-radius: 10px;
        text-decoration: none;
        font-size: 14px;
        transition: 0.3s;
        cursor: pointer;
      }
      .btn:hover {
        background: #3ea6ff;
        color: #000;
        font-weight: 600;
      }
    </style>

      /* SORT ALPHABETICALLY */
      projectsData.sort((a, b) => a.title.localeCompare(b.title));

      /* RENDER CARDS */
      function renderProjects(projects) {
        const grid = document.getElementById("appsGrid");
        grid.innerHTML = "";
        projects.forEach((project) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
                  <div class="avatar">${project.avatar}</div>
                  <h3>${project.title} <span class="badge">${
                    project.badge
                  }</span></h3>
                  <p class="details">${project.details}</p>
                  <div class="tags">
                      ${project.tags
                        .map(
                          (tag) =>
                            `<span class="tag">${tag.type}: ${tag.value}</span>`,
                        )
                        .join("")}
                  </div>
                  <div class="btn-group">
                      ${project.links
                        .map(
                          (link) => `
                          <a class="btn" ${
                            link.text === "Copy Link"
                              ? `onclick="copyLink('${link.url}')"`
                              : `href="${link.url}" target="_blank"`
                          }>${link.text}</a>
                      `,
                        )
                        .join("")}
                  </div>
              `;
          grid.appendChild(card);
        });
      }

      function copyLink(url) {
        navigator.clipboard.writeText(url);
        alert("Link copied!");
      }

      document.addEventListener("DOMContentLoaded", function () {
        const search = document.getElementById("search");
        const filterTech = document.getElementById("filter-tech");
        const filterType = document.getElementById("filter-type");

        function filterCards() {
          const searchTerm = search.value.toLowerCase();
          const techTerm = filterTech.value;
          const typeTerm = filterType.value;

          const filtered = projectsData.filter((project) => {
            const title = project.title.toLowerCase();
            const tech = project.badge;
            const type = project.tags.find((t) => t.type === "Type").value;

            return (
              (title.includes(searchTerm) || searchTerm === "") &&
              (techTerm === "" || tech.includes(techTerm)) &&
              (typeTerm === "" || type.includes(typeTerm))
            );
          });

          renderProjects(filtered);
        }

        search.addEventListener("input", filterCards);
        filterTech.addEventListener("change", filterCards);
        filterType.addEventListener("change", filterCards);

        // Initial render
        renderProjects(projectsData);
      });
